<div id="energy-bubble" class="energy-bubble">
        <span class="bubble-dot"></span>
        <span id="energy-bubble-text">--</span>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toast-message"></span>
    </div>

    <!-- ==================== DATE RANGE PICKER MODAL ==================== -->
    <div id="drp-modal" style="display:none; position:fixed; inset:0; z-index:9999;
         background:rgba(0,0,0,0.55); align-items:center; justify-content:center;
         pointer-events:none;">
        <div style="background:#1e293b; border:1px solid rgba(148,163,184,0.2);
                    border-radius:14px; padding:28px 32px; min-width:320px; max-width:420px;
                    width:90%; box-shadow:0 24px 60px rgba(0,0,0,0.5); pointer-events:auto;">
            <h3 style="margin:0 0 4px; font-size:16px; color:#f0f7ff; font-weight:600;">
                📅 Pilih Rentang Tanggal
            </h3>
            <p id="drp-subtitle" style="margin:0 0 20px; font-size:13px; color:#94a3b8;">
                Export data dalam rentang yang dipilih
            </p>

            <!-- Shortcut Buttons -->
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;">
                <button onclick="drpShortcut(1)"
                    style="flex:1; min-width:60px; padding:5px 8px; border-radius:6px;
                           background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.3);
                           color:#93c5fd; font-size:11px; cursor:pointer;">
                    Hari Ini
                </button>
                <button onclick="drpShortcut(7)"
                    style="flex:1; min-width:60px; padding:5px 8px; border-radius:6px;
                           background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.3);
                           color:#93c5fd; font-size:11px; cursor:pointer;">
                    7 Hari
                </button>
                <button onclick="drpShortcut(30)"
                    style="flex:1; min-width:60px; padding:5px 8px; border-radius:6px;
                           background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.3);
                           color:#93c5fd; font-size:11px; cursor:pointer;">
                    30 Hari
                </button>
                <button onclick="drpShortcut(0)"
                    style="flex:1; min-width:60px; padding:5px 8px; border-radius:6px;
                           background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.3);
                           color:#93c5fd; font-size:11px; cursor:pointer;">
                    Semua
                </button>
            </div>

            <!-- Date Inputs -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px;">
                <div>
                    <label style="display:block; font-size:11px; color:#64748b;
                                  margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px;">
                        Dari
                    </label>
                    <input id="drp-from" type="date"
                        style="width:100%; padding:8px 10px; border-radius:8px;
                               background:#0f172a; border:1px solid rgba(148,163,184,0.25);
                               color:#e2e8f0; font-size:13px; box-sizing:border-box;
                               outline:none; cursor:pointer;">
                </div>
                <div>
                    <label style="display:block; font-size:11px; color:#64748b;
                                  margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px;">
                        Sampai
                    </label>
                    <input id="drp-to" type="date"
                        style="width:100%; padding:8px 10px; border-radius:8px;
                               background:#0f172a; border:1px solid rgba(148,163,184,0.25);
                               color:#e2e8f0; font-size:13px; box-sizing:border-box;
                               outline:none; cursor:pointer;">
                </div>
            </div>

            <!-- Action Buttons -->
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button onclick="drpCancel()"
                    style="padding:9px 20px; border-radius:8px;
                           background:rgba(148,163,184,0.1); border:1px solid rgba(148,163,184,0.2);
                           color:#94a3b8; font-size:13px; cursor:pointer; transition:background .2s;"
                    onmouseover="this.style.background='rgba(148,163,184,0.2)'"
                    onmouseout="this.style.background='rgba(148,163,184,0.1)'">
                    Batal
                </button>
                <button onclick="drpConfirm()"
                    style="padding:9px 20px; border-radius:8px;
                           background:linear-gradient(135deg,#2563eb,#1d4ed8);
                           border:none; color:#fff; font-size:13px; font-weight:600;
                           cursor:pointer; transition:opacity .2s;"
                    onmouseover="this.style.opacity='0.85'"
                    onmouseout="this.style.opacity='1'">
                    📥 Export CSV
                </button>
            </div>
        </div>
    </div>
    <!-- ==================== END DATE RANGE PICKER MODAL ==================== -->
